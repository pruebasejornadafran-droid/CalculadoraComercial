name: Build Shine Presupuestos

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore ShinePresupuestos.csproj

      - name: Publish Windows x64
        run: >
          dotnet publish ShinePresupuestos.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish

      - name: Upload portable
        uses: actions/upload-artifact@v4
        with:
          name: Shine-Presupuestos-Portable
          path: publish/
